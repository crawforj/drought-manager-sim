beacon:
  state_file: state/entry_point_history.parquet
  lookback_days: 5
  poll_interval_seconds: 15
  poll_timeout_seconds: 600
pricing:
  # Fictional rate schedule -- structurally similar to a real tiered water
  # rate (same tier count / date pattern this repo's calibration is built
  # around), but not any real utility's actual dollar figures.
  flat_rate_by_year:
    2020: 4.1
    2021: 4.3
    2022: 4.5
    2023: 4.8
    2024: 5.0
  tiers:
  - effective_date: 2026-02-03
    tier1: 4.45
    tier2: 5.35
    tier3: 5.75
    allocation_basis: meter_size
    proxy_breakpoints_gal_per_month:
      tier1_max: 5000
      tier2_max: 15000
  - effective_date: 2026-06-01
    tier1: 4.50
    tier2: 6.90
    tier3: 9.75
    allocation_basis: eru_shareholding
    proxy_breakpoints_gal_per_month:
      tier1_max: 5000
      tier2_max: 15000
